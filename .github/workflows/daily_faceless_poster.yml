name: Autonomous Faceless Shorts & Reels Factory

on:
  schedule:
    # Runs twice daily at 11:30 AM & 08:30 PM IST (06:00 & 15:00 UTC)
    - cron: '0 6,15 * * *'
  workflow_dispatch:
    inputs:
      niche:
        description: 'Select Revenue Niche'
        required: true
        default: 'ai_tools'
        type: choice
        options:
          - ai_tools
          - wealth_hacks
          - stoic_mindset
          - productivity_tech

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Audio & Video Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Faceless Video & Revenue Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          NICHE_OPTION="${{ github.event.inputs.niche || 'ai_tools' }}"
          python main.py --niche $NICHE_OPTION
